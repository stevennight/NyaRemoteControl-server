[package]
name = "nya-client"
description = "NyaRemoteControl Windows client"
version = "0.6.2"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# Shared crates from the common repository (pinned by COMMON_REF for releases).
nya-proto = { path = "../../common/crates/nya-proto" }
nya-transport = { path = "../../common/crates/nya-transport" }
nya-media = { path = "../../common/crates/nya-media" }
nya-win = { path = "../../common/crates/nya-win" }
nya-ui = { path = "../../common/crates/nya-ui" }
nya-webui = { path = "../../common/crates/nya-webui" }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crossbeam-channel = "0.5"
winit = "0.30"
rfd = "0.15"
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
]


[build-dependencies]
winresource = "0.1.31"
