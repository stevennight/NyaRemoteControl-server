// service <-> helper messages over the named pipe. Both ends are the same
// executable, so this is not a compatibility surface.
syntax = "proto3";
package nya.ipc;

import "nya.proto";

// service -> helper (also used in-process in standalone mode)
message HostCommand {
  oneof cmd {
    nya.v1.StartStream start_stream = 1;
    nya.v1.StopStream stop_stream = 2;
    nya.v1.RequestKeyframe request_keyframe = 3;
    nya.v1.SetMode set_mode = 4;
    nya.v1.InputMsg input = 5;
    nya.v1.ClipboardText clipboard = 6;
    nya.v1.ClientCaps client_caps = 7;
    FrameSent frame_sent = 8;
    ClientGone client_gone = 9;
    Shutdown shutdown = 10;
    SetAudio set_audio = 11;
    SetBitrate set_bitrate = 12;
    ClipboardImage clipboard_image = 13;
    ClipboardFiles clipboard_files = 14;
    MicAudio mic_audio = 15;
    ClipboardOffer clipboard_offer = 16;
    ClipboardPasteDone clipboard_paste_done = 17;
  }
}

// The client copied files: put them on the host clipboard (fetched when pasted).
message ClipboardOffer { uint64 transfer_id = 1; }
// Answer to ClipboardPaste: the files are local now (paths), or `error`.
message ClipboardPasteDone {
  uint64 transfer_id = 1;
  repeated string paths = 2;
  string error = 3;
}

// One MIC datagram from the client, unchanged.
message MicAudio { bytes datagram = 1; }

// CF_DIB bytes.
message ClipboardImage { bytes dib = 1; }
// Absolute paths (host side) for CF_HDROP.
message ClipboardFiles { repeated string paths = 1; }

// Adaptive bitrate decided by the network side.
message SetBitrate { uint32 kbps = 1; }

message FrameSent {
  uint64 frame_id = 1;
  uint64 stream_id = 2;   // which pipeline (several run at once)
}
message ClientGone {}
message Shutdown {}
message SetAudio { bool enabled = 1; }

// helper -> service
message HostEvent {
  oneof ev {
    VideoFrame video = 1;
    nya.v1.CursorMsg cursor = 2;
    AudioDatagram audio = 3;
    nya.v1.SessionInfo session_info = 4;
    nya.v1.StreamStarted stream_started = 5;
    nya.v1.StreamError stream_error = 6;
    nya.v1.ClipboardText clipboard = 7;
    nya.v1.ServerStats stats = 8;
    nya.v1.DisplayChanged display_changed = 9;
    ClipboardImage clipboard_image = 10;
    ClipboardFiles clipboard_files = 11;
    nya.v1.GamepadRumble gamepad_rumble = 12;
    ClipboardPaste clipboard_paste = 13;
  }
}

// Something is pasting the client's files on the host: fetch them.
message ClipboardPaste { uint64 transfer_id = 1; }

message VideoFrame {
  uint64 stream_id = 1;
  uint64 frame_id = 2;
  bytes header = 3;   // encoded VideoFrameHeader
  bytes data = 4;
  uint32 slot = 5;      // client window the stream is for
}

message AudioDatagram { bytes datagram = 1; }
