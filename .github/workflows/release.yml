name: Release

# Push a tag v<VERSION> (scripts/release.ps1 makes it) to build the installer
# and publish a GitHub release. Versions with a suffix (0.3.0-beta.1) are
# published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Installer and zip
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out windows
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: windows
          persist-credentials: false

      - name: Read pinned common commit
        id: common
        run: |
          $ref = if (Test-Path windows/COMMON_REF) { (Get-Content windows/COMMON_REF -Raw).Trim() } else { 'main' }
          Write-Host "common: $ref"
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Check out common
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: stevennight/NyaRemoteControl-common
          ref: ${{ steps.common.outputs.ref }}
          path: common
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: common/web/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update; rustup default stable

      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) {
            choco install nsis --no-progress --yes
          }

      - name: Test
        working-directory: windows
        run: |
          ../common/scripts/fetch-ffmpeg.ps1
          ../common/scripts/fetch-vigem.ps1
          cargo test --release --locked

      - name: Build installer and zip
        working-directory: windows
        run: ./scripts/build-release.ps1 -Tag "${env:GITHUB_REF_NAME}"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: windows/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: NyaRemoteControl ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
