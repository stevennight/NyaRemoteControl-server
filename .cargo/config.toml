# common / server / client share one target directory so the common crates build once.
[build]
target-dir = "../target"

# Link the C runtime statically: target machines don't need the VC++ redistributable.
# Keep identical in all three repositories (different flags would force rebuilds).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
