[workspace]
# NyaRemoteControl for Windows: one product, several processes.
#   app   NyaRemoteControl.exe   the program users open: remote control of other
#                                computers and management of this one
#   host  nya-server-svc.exe     the remote-control service (service / helper /
#                                standalone / diag); the only one with capture
#                                and encoding
#   cli   nya-server.exe         command line for this computer's host, and the
#                                updater the service starts (copied out as
#                                nya-updater.exe)
#   core  nya-server-core        what host, cli and app share about the host
#                                (settings, pairing data, control pipe, install)
# cli and core must never depend on host or app: they would link FFmpeg, and
# the updater has to run on its own without the FFmpeg DLLs (MSVC keeps the
# imports of every object file pulled in; FFmpeg's GNU-style import libraries
# cannot be delay-loaded).
members = ["app", "host", "core", "cli"]
resolver = "2"

[profile.release]
debug = "line-tables-only"
